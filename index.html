<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NutriNeuro – Nährstoff-Tracking &amp; Neuro-Profiling Engine</title>
    <meta name="description" content="Evidenzbasiertes Nährstoff-Tracking, Kaskaden-Makroberechnung, Kofaktoren-Checks für ADHS/Autismus, Kinetik-Validierung und Pearson-Korrelationen." />
    
    <!-- Cache Control: prevent stale redirect caching on iOS Safari -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Icons & Favicons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./pwa-512x512.png" />
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="./site.webmanifest" />

    <!-- iOS Apple Mobile Web App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NutriNeuro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0891b2" />

    <!-- Google Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      // Clear any stale redirect tracking
      try {
        sessionStorage.removeItem('nutri_redirect_count');
        sessionStorage.removeItem('nutri_redirect_time');
      } catch (e) {}

      // If served on GitHub Pages root, forward to docs/ where compiled production bundle lives
      if (window.location.hostname.includes('github.io') && !window.location.pathname.includes('/docs')) {
        var base = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
        window.location.replace(base + 'docs/' + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 font-sans antialiased text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
