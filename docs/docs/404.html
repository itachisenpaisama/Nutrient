<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NutriNeuro – Routing</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Anti-Loop Guard for SPA GitHub Pages routing
      var isLoop = false;
      try {
        var count = parseInt(sessionStorage.getItem('nutri_redirect_count') || '0', 10);
        var lastTime = parseInt(sessionStorage.getItem('nutri_redirect_time') || '0', 10);
        var now = Date.now();
        if (now - lastTime < 5000 && count >= 2) {
          isLoop = true;
          sessionStorage.removeItem('nutri_redirect_count');
        } else {
          sessionStorage.setItem('nutri_redirect_count', (count + 1).toString());
          sessionStorage.setItem('nutri_redirect_time', now.toString());
        }
      } catch (e) {
        isLoop = false;
      }

      if (!isLoop) {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // If lowercase nutrient used in URL, correct it
        if (/^\/nutrient/i.test(path) && !path.startsWith('/Nutrient')) {
          var fixed = path.replace(/^\/nutrient/i, '/Nutrient');
          window.location.replace(fixed + search + hash);
        } else if (path.includes('/docs')) {
          // If accessing /docs, redirect to /Nutrient/docs/
          window.location.replace('/Nutrient/docs/' + search + hash);
        } else {
          // Default SPA fallback
          window.location.replace('/Nutrient/' + search + hash);
        }
      }
    </script>
    <style>
      body {
        background-color: #090d16;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: #111827;
        border: 1px solid #1e293b;
        border-radius: 20px;
        padding: 32px 24px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 9999px;
        background: rgba(6, 182, 212, 0.15);
        border: 1px solid rgba(6, 182, 212, 0.3);
        color: #22d3ee;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      h2 {
        color: #f8fafc;
        margin: 0 0 8px 0;
        font-size: 22px;
      }
      p {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 24px 0;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 14px 20px;
        background: linear-gradient(135deg, #06b6d4, #3b82f6);
        color: white;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        border-radius: 12px;
        box-sizing: border-box;
        box-shadow: 0 10px 15px -3px rgba(6, 182, 212, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        <span>⚡</span> NutriNeuro Navigation
      </div>
      <h2>NutriNeuro wird geöffnet</h2>
      <p>Falls du nicht automatisch weitergeleitet wirst oder der Safari-Cache veraltet ist, tippe bitte auf den Button unten:</p>
      <a href="/Nutrient/" class="btn" onclick="try{sessionStorage.clear();}catch(e){}">🚀 NutriNeuro jetzt starten</a>
    </div>
  </body>
</html>
